<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connecting TikTok - Bilgi Dozu Uploader</title>
  <link rel="stylesheet" href="../../style.css">
</head>
<body>
  <main>
    <h1>Connecting TikTok…</h1>
    <p id="status">Returning to the uploader running on your computer.</p>
    <div class="box" id="details" hidden></div>
  </main>
  <script>
    // TikTok yalnızca https adreslerine dönüyor; yetki kodu bilgisayarda çalışan kurulum aracına iletilir.
    // state "<port>.<rastgele>" biçimindedir, böylece her bot kendi portunu kullanır.
    const params = new URLSearchParams(location.search);
    const port = (params.get('state') || '').split('.')[0];
    const status = document.getElementById('status');
    const details = document.getElementById('details');
    if (params.get('error')) {
      status.textContent = 'TikTok returned an error.';
      details.hidden = false;
      details.textContent = params.get('error') + ': ' + (params.get('error_description') || '');
    } else if (!/^\d{2,5}$/.test(port) || !params.get('code')) {
      status.textContent = 'Missing authorization code.';
    } else {
      details.hidden = false;
      details.textContent = 'If nothing happens, make sure the uploader setup is running on this computer. Code: ' + params.get('code');
      setTimeout(() => location.replace('http://localhost:' + port + '/tiktok/callback' + location.search), 600);
    }
  </script>
</body>
</html>
